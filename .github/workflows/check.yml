name: Check
on:
  push:
    branches: [main]
    paths: &code-paths
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'patches/**'
      - 'public/models/**'
      - 'public/textures/**'
      - 'public/audio/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.npmrc'
      - 'next.config.*'
      - 'tsconfig*.json'
      - 'playwright.config.*'
      - '.github/workflows/**'
  pull_request:
    paths: *code-paths
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_DECISION_BACKEND: preview
      NEXT_PUBLIC_JEV_SESSION_AUDIT: '0'
      NEXT_PUBLIC_RENDER_QUALITY: low
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        timeout-minutes: 8
      - name: Check mocked live decisions and fallback
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_DECISION_BACKEND: jev
        timeout-minutes: 6
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
