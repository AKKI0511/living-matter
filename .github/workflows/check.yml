name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_DECISION_BACKEND: preview
      NEXT_PUBLIC_JEV_SESSION_AUDIT: '0'
      NEXT_PUBLIC_RENDER_QUALITY: low
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check formation traversal before the full browser suite
        run: pnpm exec playwright test formations.spec.ts -g 'reach also'
        timeout-minutes: 4
      - run: pnpm test:e2e
        timeout-minutes: 20
      - name: Check mocked live transport
        run: pnpm exec playwright test live-transport.spec.ts
        env:
          NEXT_PUBLIC_DECISION_BACKEND: jev
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
